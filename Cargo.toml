[package]
name = "pay-on-proof"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Leif Rydenfalk <59741378+Leif-Rydenfalk@users.noreply.github.com>"]
repository = "https://github.com/ce-net/demo-pay-on-proof"
description = "Work that pays only when it checks out: job.board, job.check and reward.issue cells."
default-run = "pay-on-proof"

[dependencies]
ce-net-proto = { git = "https://github.com/ce-net/ce-net-proto", rev = "ff449250618cc70bde491055cb97e8ef42121390" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3

# a standalone workspace, even when cloned inside another one
[workspace]
